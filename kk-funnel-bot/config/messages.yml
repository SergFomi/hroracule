messages:
  welcome:
    text: |
      Привет! 👋
      
      Вы хотите получить гайд по тому, как найти удаленную работу и создать крутое резюме?
      
      Супер! Сейчас всё отправлю 🚀
    
  guide_intro:
    text: "Вот подробный гайд по созданию резюме для удаленки:"
    forward_from_channel: true  # Переслать пост из канала
    channel_post_id: 56  # ID поста в канале (замени на реальный)
  
  resume_sample:
    text: "А вот образец резюме, который поможет тебе выделиться среди других кандидатов:"
    file_path: "example_prodact.pdf"  # Файл должен быть в папке media/
  
  webinar_invite:
    text: |
      🎯 Завтра провожу вебинар по поиску удаленной работы!
      
      Разберем:
      • Как составить резюме, которое заметят
      • Где искать вакансии
      • Как пройти собеседование
      
      Участвуешь?
    buttons:
      - text: "Да, буду!"
        callback_data: "webinar_yes"
      - text: "Нет, спасибо"
        callback_data: "webinar_no"
  
  webinar_link:
    text: |
      Отлично! Вот ссылка на вебинар:
      
      🔗 https://example.com/webinar
      
      До встречи завтра! 👋
  
  webinar_decline:
    text: "Жаль, что не получится! Если передумаешь - напиши мне 😊"
  
  followup_1:
    text: |
      Привет! Как успехи с резюме? 
      
      Если нужна помощь - пиши, разберем вместе! 💪

admin:
  user_registered: "✅ Новый пользователь: {name} (@{username})"
  stats_header: "📊 Статистика бота\n"
