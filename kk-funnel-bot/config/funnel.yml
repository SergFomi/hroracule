funnel:
  # All messages sent immediately one after another
  - stage: "welcome"
    delay_seconds: 0
    message_key: "welcome"
    
  - stage: "guide"
    delay_seconds: 0
    message_key: "guide_intro"
    
  - stage: "resume"
    delay_seconds: 0
    message_key: "resume_sample"
  
  - stage: "channel_subscribe"
    delay_seconds: 0
    message_key: "channel_subscribe"
  
  # Webinar invite - отправляется вручную админом через /send_webinar
  # Follow-up также отправляется вручную при необходимости

settings:
  timezone: "Europe/Moscow"
  max_retries: 3  # Количество попыток отправки при ошибке
  retry_delay: 300  # Задержка между попытками (секунды)
